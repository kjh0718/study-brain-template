<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의 수집 도구</title>
<link rel="icon" href="data:,">
<style>
  /* 토큰은 Toss TDS foundation 값. 글꼴 파일은 싣지 않고 PC에 깔린 것만 쓴다. */
  :root {
    color-scheme: light;
    --g50:#f9fafb; --g100:#f2f4f6; --g200:#e5e8eb; --g300:#d1d6db; --g400:#b0b8c1; --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968; --g900:#191f28;
    --b50:#e8f3ff; --b500:#3182f6; --b600:#2272eb; --b700:#1b64da;
    --r500:#f04452; --r50:#ffeeee; --green:#03b26c;
    --gutter:24px; --side:260px; --gap:20px;
  }
  @media (min-width: 1600px) { :root { --gutter:32px; --side:280px; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--g100); color:var(--g900); font:400 15px/22.5px "Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif; -webkit-text-size-adjust:100%; }
  h1 { font-size:17px; line-height:25.5px; font-weight:700; letter-spacing:-0.2px; margin:0; }
  h2 { font-size:20px; line-height:29px; font-weight:700; letter-spacing:-0.2px; margin:0 0 16px; }
  p { margin:0; }
  input, select, button { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--b500); outline-offset:2px; }
  .hide { display:none !important; }

  /* 위 막대, 본문 틀: 화면 폭 전체를 쓴다. 위 막대 제목과 왼쪽 목록은 같은 여백(--gutter)에서 시작한다. */
  .top { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--g200); }
  .top-in { height:56px; padding:0 var(--gutter); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  #login-head { display:none; align-items:center; gap:12px; min-width:0; }
  #login-head.on { display:flex; }
  #login-state { color:var(--g600); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .shell { padding:var(--gap) var(--gutter) 48px; display:grid; grid-template-columns:var(--side) minmax(0,1fr); gap:var(--gap); align-items:start; }
  /* 위 막대 높이 57px(56 + 테두리 1) + 블록 사이 간격 */
  .side { position:sticky; top:calc(57px + var(--gap)); max-height:calc(100vh - 57px - 2 * var(--gap)); overflow:auto; }
  /* 오른쪽 칸은 남는 폭을 다 쓰되, 안쪽 내용만 1280px까지(왼쪽 정렬). 강의 열 수는 이 칸의 폭으로 정한다. */
  .main { min-width:0; container-type:inline-size; }
  .col { display:flex; flex-direction:column; gap:var(--gap); max-width:1280px; }
  section, aside { background:#fff; border-radius:16px; padding:24px; }
  .head { display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:8px 16px; margin-bottom:16px; }
  .head h2 { margin:0; }

  /* 글자 */
  .minor { font-size:13px; line-height:19.5px; color:var(--g600); }
  .minor:empty, .msg:empty { display:none; }
  .msg { margin-top:8px; font-size:15px; }
  .bad { color:var(--r500); } .ok { color:var(--green); }
  code { font:500 14px/20px Consolas,"Malgun Gothic",monospace; background:var(--g200); padding:1px 6px; border-radius:6px; overflow-wrap:anywhere; }

  /* 입력 */
  .f { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .f > span { font-size:13px; line-height:19.5px; color:var(--g700); }
  .fields { display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; }
  .fields .f { flex:0 0 auto; }
  .fields .grow { flex:1 1 150px; }
  input[type=text], input[type=password], input[type=number], input[type=date], select {
    height:48px; width:100%; min-width:0; padding:0 14px; background:var(--g100); border:0; border-radius:12px; color:var(--g900); outline:none; }
  input[type=text]::placeholder, input[type=password]::placeholder { color:var(--g500); }
  input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, input[type=date]:focus, select:focus { outline:2px solid var(--b500); outline-offset:0; }
  input[type=number] { width:84px; }
  input[type=date] { width:164px; }
  select { padding-right:10px; }
  /* 촘촘한 줄(강의, 파일, 학기 고르기)은 작게 */
  .lec input[type=number], .lec input[type=date], .file input[type=number], .file input[type=date], .file select, .head select { height:40px; border-radius:10px; padding:0 10px; }
  .lec input[type=number], .file input[type=number] { width:60px; -moz-appearance:textfield; appearance:textfield; }
  .lec input[type=date], .file input[type=date] { width:150px; }
  .lec input[type=number]::-webkit-inner-spin-button, .file input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .mini { display:flex; align-items:center; gap:6px; }
  .mini > span { font-size:13px; color:var(--g700); white-space:nowrap; }
  .head .mini select { width:200px; }

  /* 체크박스(기본 모양을 걷어내고 같은 크기로 그린다) */
  input[type=checkbox] { appearance:none; -webkit-appearance:none; flex:0 0 20px; width:20px; height:20px; margin:2px 0 0; background:#fff; border:1.5px solid var(--g300); border-radius:6px; cursor:pointer; position:relative; }
  input[type=checkbox]:checked { background:var(--b500); border-color:var(--b500); }
  input[type=checkbox]:checked::after { content:""; position:absolute; left:5.5px; top:2px; width:5px; height:9px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }

  /* 버튼 */
  button { border:0; cursor:pointer; font-weight:500; }
  .btn { height:48px; padding:0 20px; border-radius:12px; background:var(--b500); color:#fff; font-size:16px; font-weight:600; }
  .btn:hover { background:var(--b600); }
  .primary { width:100%; height:56px; border-radius:16px; background:var(--b500); color:#fff; font-size:17px; line-height:25.5px; font-weight:600; letter-spacing:-0.2px; }
  .primary:hover:not(:disabled) { background:var(--b600); }
  .primary:disabled { background:var(--g200); color:var(--g500); cursor:not-allowed; }
  .weak, .gray { height:34px; padding:0 12px; border-radius:8px; font-size:14px; white-space:nowrap; }
  .weak { background:var(--b50); color:var(--b700); }
  .weak:hover { background:#d4e8ff; }
  .gray { background:var(--g100); color:var(--g700); }
  .gray:hover { background:var(--g200); }

  /* 왼쪽 과목 목록: 라디오는 숨기고 줄 전체를 고르는 칸으로 쓴다 */
  #login-msg { margin-bottom:8px; }
  #courses { margin-top:12px; }
  .pick { display:block; position:relative; margin:2px -12px; padding:10px 12px; border-radius:10px; cursor:pointer; }
  .pick:hover { background:var(--g50); }
  .pick:has(input:checked) { background:var(--b50); }
  .pick:has(input:checked) .t { color:var(--b700); }
  .pick:has(:focus-visible) { outline:2px solid var(--b500); outline-offset:0; }
  .pick input { position:absolute; opacity:0; pointer-events:none; }
  .pick .t { font-size:15px; line-height:22.5px; }
  .pick .d { font-size:13px; line-height:19.5px; }
  .manual-row .t { color:var(--b500); }

  /* 목록 행: 위 글자(제목), 아래 글자(설명), 오른쪽(상태나 작은 버튼) */
  .lr { position:relative; display:flex; flex-wrap:wrap; align-items:flex-start; gap:4px 12px; padding:12px 0; }
  .lr ~ .lr::before { content:""; position:absolute; top:0; left:0; right:0; height:1px; background:var(--g200); }
  .lr-main { flex:1 1 0; min-width:0; }
  .lr-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .lr-top .t { flex:1 1 0; min-width:0; }
  .lr-top button { flex:0 0 auto; }
  .lr-side { flex:0 0 auto; max-width:50%; display:flex; flex-direction:column; align-items:flex-end; gap:8px; text-align:right; }
  .t { display:block; font-size:17px; line-height:25.5px; font-weight:600; letter-spacing:-0.2px; word-break:keep-all; overflow-wrap:anywhere; }
  .d { display:block; color:var(--g600); font-size:15px; line-height:22.5px; word-break:keep-all; overflow-wrap:anywhere; }
  .d.bad { color:var(--r500); }
  .status { font-weight:500; color:var(--g600); white-space:nowrap; }
  .status.run { color:var(--b500); } .status.done { color:var(--green); } .status.fail { color:var(--r500); } .status.none { color:var(--g500); font-weight:400; }
  .acts { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; }
  .bar { flex:none; width:100%; height:6px; border-radius:999px; background:var(--g200); overflow:hidden; margin:4px 0 4px; }
  .bar > i { display:block; height:100%; width:0; border-radius:999px; background:var(--b500); transition:width 300ms ease; }
  @media (prefers-reduced-motion: reduce) { .bar > i { transition:none; } }
  #items { max-height:60vh; overflow:auto; }

  /* 이캠퍼스 강의: 2열. 안 고른 강의는 오른쪽에 상태, 고르면 주차·차시 칸 */
  .lec-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 32px; align-items:start; }
  .lec { position:relative; display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:12px 0; }
  .lec::before { content:""; position:absolute; top:0; left:0; right:0; height:1px; background:var(--g200); }
  .lec:first-child::before, .lec:nth-child(2)::before { display:none; }
  .lec-head { flex:1 1 0; min-width:0; display:flex; gap:12px; align-items:flex-start; cursor:pointer; }
  .lec .t { font-size:15px; line-height:22.5px; }
  .lec .status { flex:none; font-size:14px; }
  .lec-nums { flex:none; display:flex; align-items:center; gap:10px; }
  .lec-detail { flex:1 1 100%; margin-left:32px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; }
  .lec-detail .confirm { display:flex; gap:8px; align-items:center; cursor:pointer; font-size:14px; }
  .lec-detail .confirm input { margin:0; }
  .empty { padding:24px 0 8px; text-align:center; }
  @container (min-width: 1400px) {
    .lec-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .lec:nth-child(3)::before { display:none; }
  }

  /* 드롭 영역과 실행: 위 줄에 드롭 둘과 실행, 아래 줄에 각 드롭 아래로 파일 */
  .up { display:grid; grid-template-columns:1fr 1fr 160px; gap:0 12px; }
  .lec-box:not(.hide) + .up { margin-top:20px; }
  .drop { display:flex; flex-direction:column; justify-content:center; align-items:center; gap:2px; min-height:104px; padding:18px 16px; text-align:center; color:var(--g600); background:var(--g50); border:1.5px dashed var(--g300); border-radius:16px; cursor:pointer; }
  .drop .t { color:var(--g900); font-size:15px; line-height:22.5px; }
  .drop .d { font-size:13px; line-height:19.5px; }
  .drop:hover { border-color:var(--g400); }
  .drop:focus-within { outline:2px solid var(--b500); outline-offset:2px; }
  .drop.over { background:var(--b50); border-color:var(--b500); }
  .up .primary { height:auto; min-height:56px; align-self:stretch; }
  .file .t { font-size:15px; line-height:22.5px; }
  .file .fields { margin-top:8px; align-items:flex-end; gap:8px 10px; }
  .file .fields .f > span { font-size:12px; line-height:18px; }
  #why, #run-log { grid-column:1 / -1; }
  #why { margin-top:12px; }
  #run-log { margin-top:8px; }
  #run-log > div { padding:2px 0; }

  /* 안내 */
  .banner { background:#fff; border-radius:12px; padding:14px 20px; }
  .banner:empty { display:none; }
  .callout { margin-top:12px; padding:14px 16px; border-radius:12px; background:var(--g50); font-weight:500; }

  .mgrid { display:grid; grid-template-columns:2fr 1.5fr 1fr 1fr; gap:12px; margin-bottom:20px; }

  /* 960px 미만: 한 단. 드롭 영역은 세로로 쌓고 실행은 맨 아래 */
  @media (max-width: 959px) {
    .shell { grid-template-columns:minmax(0,1fr); gap:16px; }
    .col { gap:16px; }
    .side { position:static; max-height:none; overflow:visible; }
    .up { grid-template-columns:1fr; }
    .up .primary { order:5; margin-top:16px; height:56px; }
    #drop-rec { order:1; } #recs { order:2; } #drop-pdf { order:3; margin-top:12px; } #pdf-col { order:4; }
    #why, #run-log { order:6; }
    .mgrid { grid-template-columns:1fr 1fr; }
  }
  /* 720~959px: 과목은 가로로 넘겨 보는 칩 */
  @media (min-width: 720px) and (max-width: 959px) {
    #courses { display:flex; gap:8px; overflow-x:auto; padding:2px 12px 4px; margin:8px -12px 0; }
    #course-list { display:contents; }
    .pick { flex:none; margin:0; padding:8px 14px; background:var(--g100); white-space:nowrap; }
    .pick:hover { background:var(--g200); }
    .pick:has(input:checked) { background:var(--b50); }
  }
  /* 720px 미만: 한 줄 배치 */
  @media (max-width: 719px) {
    :root { --gutter:16px; --gap:16px; }
    section, aside { border-radius:20px; padding:20px; }
    .lec-grid { grid-template-columns:1fr; }
    .lec:nth-child(2)::before { display:block; }
    .pick { margin:2px -8px; padding:10px 8px; }
    .lr.li { flex-direction:column; align-items:stretch; }
    .li .lr-side { max-width:none; align-items:flex-start; text-align:left; gap:8px; }
    .li .acts { justify-content:flex-start; }
    .li .lr-main { flex:1 1 auto; }
    .fields .f.date { flex:1 1 100%; }
  }
  @media (max-width: 479px) { .mgrid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1>강의 수집 도구</h1>
  <div id="login-head">
    <span id="login-state"></span>
    <button id="logout-btn" type="button" class="gray hide">로그아웃</button>
  </div>
</div></header>

<div class="shell">
  <aside id="s-course" class="side">
    <h2>과목</h2>
    <form id="login" autocomplete="off">
      <p class="d">학교 계정으로 로그인해 주세요</p>
      <div id="login-fields" class="fields">
        <label class="f grow"><span>학번</span><input id="sid" type="text" inputmode="numeric" autocomplete="off"></label>
        <label class="f grow"><span>비밀번호</span><input id="pw" type="password" autocomplete="off"></label>
      </div>
      <button id="login-btn" type="submit" class="btn" style="margin-top:12px;width:100%">로그인</button>
    </form>
    <div id="login-msg" class="msg bad"></div>
    <div id="courses" role="radiogroup" aria-label="과목">
      <div id="course-list"></div>
      <label class="pick manual-row"><input type="radio" name="course" value="manual"><span class="t">직접 입력하기</span></label>
    </div>
  </aside>

  <main class="main"><div class="col">
    <div id="banner-login" class="banner"></div>
    <div id="banner-ffmpeg" class="banner"></div>

    <section id="s-items">
      <div class="head"><h2 id="items-title">강의</h2><div id="term-pick"></div></div>
      <p id="empty-note" class="d empty">왼쪽에서 과목을 골라 주세요</p>
      <div id="manual" class="mgrid hide">
        <label class="f"><span>과목명</span><input id="m-name" type="text" maxlength="100"></label>
        <label class="f"><span>학기</span><select id="m-term"></select></label>
        <label class="f"><span>학수번호 (선택)</span><input id="m-code" type="text" maxlength="30"></label>
        <label class="f"><span>분반 (선택)</span><input id="m-section" type="text" maxlength="10"></label>
      </div>
      <div id="lec-box" class="lec-box hide">
        <div id="lec-msg" class="minor" style="margin-bottom:4px"></div>
        <div id="lectures" class="lec-grid"></div>
      </div>
      <div id="up" class="up hide">
        <label class="drop" id="drop-rec"><span class="t">녹음이나 영상을 여기에 놓아 주세요</span><span class="d">또는 눌러서 골라 주세요</span>
          <input id="in-rec" type="file" multiple hidden></label>
        <label class="drop" id="drop-pdf"><span class="t">PDF를 여기에 놓아 주세요</span><span class="d">자료, 족보, 과제를 눌러서 골라도 돼요</span>
          <input id="in-pdf" type="file" multiple hidden></label>
        <button id="run" class="primary" disabled>실행하기</button>
        <div id="recs"></div>
        <div id="pdf-col"><div id="pdf-note" class="msg bad" style="margin-top:0"></div><div id="pdfs"></div></div>
        <p id="why" class="minor"></p>
        <div id="run-log"></div>
      </div>
    </section>

    <section>
      <h2>진행</h2>
      <div id="conn" class="msg bad" style="margin:0 0 8px"></div>
      <div id="items"><p class="d">아직 항목이 없어요.</p></div>
      <div id="item-msg" class="msg bad"></div>
      <div id="done-msg" class="callout hide"></div>
    </section>
  </div></main>
</div>

<script>
"use strict";
// 서버가 준 문자열(강의 제목·오류·파일명 등)은 textContent/텍스트 노드로만 화면에 넣는다.
const $ = (id) => document.getElementById(id);
const HDR = { "X-Lecture-Inbox": "1" };

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === "cls") e.className = v;
    else e[k] = v;
  }
  for (const k of kids) e.append(k);
  return e;
}

/** 이름표가 붙은 입력칸. */
function field(text, input, cls) { return el("label", { cls: "f" + (cls ? " " + cls : "") }, el("span", { textContent: text }), input); }

async function api(path, opts = {}) {
  try {
    const r = await fetch(path, { ...opts, headers: { ...HDR, ...(opts.headers || {}) } });
    let data = null;
    try { data = await r.json(); } catch (_) { /* 본문 없음 */ }
    return { ok: r.ok, status: r.status, data, detail: data && typeof data.detail === "string" ? data.detail : "" };
  } catch (_) {
    return { ok: false, status: 0, data: null, detail: "서버에 연결하지 못했어요." };
  }
}

const KIND = { transcript: "전사", resource: "자료", "past-exam": "족보", assignment: "과제" };
const pad = (n) => String(n).padStart(2, "0");
const localDate = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const num = (v) => { const n = Number(v); return Number.isInteger(n) && n >= 1 && n <= 99 ? n : null; };

/* ---------- 학기 선택 ---------- */
function termOptions(sel) {
  const y = new Date().getFullYear();
  sel.append(el("option", { value: "", textContent: "학기를 골라 주세요" }));
  for (const year of [y, y - 1]) {
    for (const [s, label] of [["1", "1학기"], ["2", "2학기"], ["summer", "여름"], ["winter", "겨울"]]) {
      sel.append(el("option", { value: `${year}-${s}`, textContent: `${year}년 ${label}` }));
    }
  }
}
termOptions($("m-term"));

/* ---------- 상태 ---------- */
let loggedIn = false;
let courses = [];          // 서버 목록 [{id,name,code,section,year,semester,term}]
let choice = null;         // null(아직 안 골랐어요), "manual", 또는 courses 인덱스(문자열)
let termPick = "";         // term이 null인 목록 과목에 대해 고른 학기
let loginId = "";          // 위 막대에 보여 줄 학번. 입력칸에는 남기지 않는다
let statusItems = [];      // 마지막으로 받은 /api/status 항목
let lectures = [];         // [{lec, on, ok, week, session, date, stat}]
let recs = [];             // [{file, week, session, date, error}]
let pdfs = [];             // [{file, kind, error}]
let busy = false;

/** 현재 과목. 목록 과목은 항상 ecampusId를 같이 보낸다(같은 날 묶음이 409가 되지 않게). */
function currentCourse() {
  if (choice === "manual") {
    const name = $("m-name").value.trim(), term = $("m-term").value;
    if (!name || !term) return null;
    const c = { course: name, term };
    if ($("m-code").value.trim()) c.code = $("m-code").value.trim();
    if ($("m-section").value.trim()) c.section = $("m-section").value.trim();
    return c;
  }
  const c = choice === null ? null : courses[Number(choice)];
  const term = c && (c.term || termPick);
  if (!term) return null;
  const r = { course: c.name, term, ecampusId: String(c.id) };
  if (c.code) r.code = c.code;
  if (c.section) r.section = c.section;
  return r;
}

const TERM = { "1": "1학기", "2": "2학기", summer: "여름", winter: "겨울" };
const termText = (t) => { const [y, s] = t.split("-"); return TERM[s] ? `${y}년 ${TERM[s]}` : t; };

/* ---------- 로그인·과목 ---------- */
function setLogin(on) {
  loggedIn = on;
  if (!on) loginId = "";
  $("login").classList.toggle("hide", on);
  $("course-list").classList.toggle("hide", !on);
  $("logout-btn").classList.toggle("hide", !on);
  $("login-head").classList.toggle("on", on);
  $("login-state").textContent = on ? (loginId ? `${loginId} 로그인됨` : "로그인됨") : "";
}

$("login").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const sid = $("sid").value.trim();
  const body = JSON.stringify({ studentId: sid, password: $("pw").value });
  const pending = api("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body });
  $("pw").value = ""; $("sid").value = ""; // 요청을 보낸 직후 비운다(입력칸에는 학번도 남기지 않는다)
  $("login-msg").textContent = "";
  const r = await pending;
  if (!r.ok) { $("login-msg").textContent = r.detail || "로그인하지 못했어요."; return; }
  loginId = sid;
  setLogin(true);
  loadCourses();
});

$("logout-btn").addEventListener("click", async () => {
  await api("/api/logout", { method: "POST" });
  setLogin(false);
  courses = [];
  selectCourse(choice === "manual" ? "manual" : null);
  renderCourses();
});

async function loadCourses() {
  const r = await api("/api/courses");
  if (!r.ok) {
    $("login-msg").textContent = r.detail || "과목 목록을 불러오지 못했어요.";
    if (r.status === 401 || r.status === 409) setLogin(false);
    return;
  }
  courses = r.data.courses;
  renderCourses();
}

function renderCourses() {
  const box = $("course-list");
  box.replaceChildren();
  courses.forEach((c, i) => {
    const radio = el("input", { type: "radio", name: "course", value: String(i), checked: choice === String(i),
      on: { change: () => selectCourse(String(i)) } });
    box.append(el("label", { cls: "pick" }, radio, el("span", { cls: "t", textContent: c.name }),
      el("span", { cls: "d", textContent: (c.term ? termText(c.term) : `학기를 알 수 없어요 (${c.year} ${c.semester})`)
        + (c.code ? `, ${c.code}${c.section ? "-" + c.section + "분반" : ""}` : "") })));
  });
}

/** 현재 고른 이캠퍼스 과목. 직접 입력이거나 안 골랐으면 null. */
const listed = () => (choice === null || choice === "manual" ? null : courses[Number(choice)] || null);

/** 오른쪽 위 블록의 제목과 그 아래 어떤 칸을 보일지. */
function renderHead() {
  const c = listed(), manual = choice === "manual";
  $("items-title").textContent = manual ? "직접 입력한 과목" : c ? `${c.name} 강의` : "강의";
  $("empty-note").classList.toggle("hide", choice !== null);
  $("manual").classList.toggle("hide", !manual);
  $("lec-box").classList.toggle("hide", !c);
  $("up").classList.toggle("hide", choice === null);
  const box = $("term-pick");
  box.replaceChildren();
  if (c && c.term === null) { // 학교가 학기를 알려 주지 않은 과목은 여기서 고른다
    const sel = el("select", { on: { change: (e) => { termPick = e.target.value; update(); } } });
    termOptions(sel);
    sel.value = termPick;
    box.append(el("label", { cls: "mini" }, el("span", { textContent: "학기" }), sel));
  }
}

function selectCourse(value) {
  choice = value;
  termPick = "";
  lectures = [];
  renderLectures();
  document.querySelectorAll("input[name=course]").forEach((r) => { r.checked = r.value === value; });
  renderCourses();
  renderHead();
  if (listed()) loadLectures(listed().id);
  update();
}
document.querySelector("input[name=course][value=manual]").addEventListener("change", () => selectCourse("manual"));
for (const id of ["m-name", "m-term", "m-code", "m-section"]) $(id).addEventListener("input", update);

/* ---------- 이캠퍼스 강의 ---------- */
async function loadLectures(courseId) {
  $("lec-msg").textContent = "강의 목록을 불러오고 있어요";
  const r = await api(`/api/courses/${encodeURIComponent(courseId)}/lectures`);
  if (!listed() || String(listed().id) !== String(courseId)) return; // 그 사이 다른 과목을 골랐다
  if (!r.ok) {
    $("lec-msg").textContent = r.detail || "강의 목록을 불러오지 못했어요.";
    if (r.status === 401 || r.status === 409) setLogin(false);
    return;
  }
  $("lec-msg").textContent = r.data.lectures.length ? "받을 강의를 골라서 주차와 차시를 확인해 주세요." : "받을 강의가 없어요.";
  lectures = r.data.lectures.map((lec) => ({ lec, on: false, ok: false,
    week: lec.week == null ? "" : String(lec.week), session: lec.session == null ? "" : String(lec.session), date: "" }));
  renderLectures();
  update();
}

/** 이름표가 왼쪽에 붙는 작은 입력칸. */
function mini(text, input) { return el("label", { cls: "mini" }, el("span", { textContent: text }), input); }

function renderLectures() {
  const box = $("lectures");
  box.replaceChildren();
  for (const m of lectures) {
    const week = el("input", { type: "number", min: 1, max: 99, value: m.week, on: { input: (e) => { m.week = e.target.value; update(); } } });
    const session = el("input", { type: "number", min: 1, max: 99, value: m.session, on: { input: (e) => { m.session = e.target.value; update(); } } });
    const date = el("input", { type: "date", value: m.date, on: { input: (e) => { m.date = e.target.value; update(); } } });
    const ok = el("input", { type: "checkbox", checked: m.ok, on: { change: (e) => { m.ok = e.target.checked; update(); } } });
    m.stat = el("span", { cls: "status" });
    const nums = el("div", { cls: "lec-nums" + (m.on ? "" : " hide") }, mini("주차", week), mini("차시", session));
    const detail = el("div", { cls: "lec-detail" + (m.on ? "" : " hide") },
      el("label", { cls: "confirm" }, ok, "주차와 차시를 확인했어요"), mini("수업일 (비워도 돼요)", date));
    const on = el("input", { type: "checkbox", checked: m.on, on: { change: (e) => {
      m.on = e.target.checked; if (!m.on) m.ok = false;
      nums.classList.toggle("hide", !m.on); detail.classList.toggle("hide", !m.on); m.stat.classList.toggle("hide", m.on);
      ok.checked = m.ok; update(); } } });
    box.append(el("div", { cls: "lec" },
      el("label", { cls: "lec-head" }, on, el("span", { cls: "t", textContent: m.lec.title })), m.stat, nums, detail));
  }
  paintLectureStatus();
}

/** 강의마다 이미 등록된 항목의 최신 상태를 오른쪽에 보인다. 입력 중인 칸은 건드리지 않는다. */
function paintLectureStatus() {
  for (const m of lectures) {
    const mine = statusItems.filter((it) => it.source && it.source.type === "ecampus" && String(it.source.lecture_id) === String(m.lec.id));
    let text = "아직 안 받았어요", tone = "none";
    if (mine.length) {
      const it = mine.reduce((a, b) => ((b.created || "") > (a.created || "") ? b : a));
      [text, tone] = label(it);
      if (it.status === "done") text = "받았어요";
      else if (it.status === "downloading") tone = "run";
    }
    m.stat.textContent = text;
    m.stat.className = "status" + (tone ? " " + tone : "") + (m.on ? " hide" : "");
  }
}

/* ---------- 파일 ---------- */
function dropzone(id, inputId, onFiles) {
  const zone = $(id), input = $(inputId);
  input.addEventListener("change", () => { onFiles([...input.files]); input.value = ""; });
  zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", (e) => { e.preventDefault(); zone.classList.remove("over"); onFiles([...e.dataTransfer.files]); });
}

dropzone("drop-rec", "in-rec", (files) => {
  for (const file of files) recs.push({ file, week: "", session: "", date: "", fileDate: localDate(file.lastModified), error: "" });
  renderRecs(); update();
});

dropzone("drop-pdf", "in-pdf", (files) => {
  const rejected = [];
  for (const file of files) {
    if (file.name.toLowerCase().endsWith(".pdf")) pdfs.push({ file, kind: "resource", error: "" });
    else rejected.push(file.name);
  }
  $("pdf-note").textContent = rejected.length ? `${rejected.join(", ")}: PDF로 바꿔서 올려 주세요` : "";
  renderPdfs(); update();
});

function removeBtn(list, entry, render) {
  return el("button", { type: "button", cls: "gray", textContent: "빼기", on: { click: () => {
    list.splice(list.indexOf(entry), 1); render(); update(); } } });
}

function renderRecs() {
  const box = $("recs");
  box.replaceChildren();
  for (const m of recs) {
    const week = el("input", { type: "number", min: 1, max: 99, value: m.week, on: { input: (e) => { m.week = e.target.value; update(); } } });
    const session = el("input", { type: "number", min: 1, max: 99, value: m.session, on: { input: (e) => { m.session = e.target.value; update(); } } });
    const date = el("input", { type: "date", value: m.date, on: { input: (e) => { m.date = e.target.value; } } });
    // 파일 수정일은 수업일이 아닐 수 있으므로 사용자가 눌렀을 때만 채운다.
    const useFileDate = el("button", { type: "button", cls: "weak", textContent: `파일 날짜 사용 (${m.fileDate})`,
      on: { click: () => { m.date = m.fileDate; renderRecs(); } } });
    box.append(el("div", { cls: "lr file" },
      el("div", { cls: "lr-main" },
        el("div", { cls: "lr-top" }, el("span", { cls: "t", textContent: m.file.name }), removeBtn(recs, m, renderRecs)),
        el("div", { cls: "fields" }, field("주차", week), field("차시", session), field("수업일 (비워도 돼요)", date, "date"),
          ...(m.date ? [] : [useFileDate])),
        el("span", { cls: "d bad", textContent: m.error }))));
  }
}

function renderPdfs() {
  const box = $("pdfs");
  box.replaceChildren();
  for (const m of pdfs) {
    const kind = el("select", { on: { change: (e) => { m.kind = e.target.value; } } },
      el("option", { value: "resource", textContent: "자료" }),
      el("option", { value: "past-exam", textContent: "족보" }),
      el("option", { value: "assignment", textContent: "과제" }));
    kind.value = m.kind;
    box.append(el("div", { cls: "lr file" },
      el("div", { cls: "lr-main" },
        el("div", { cls: "lr-top" }, el("span", { cls: "t", textContent: m.file.name }), removeBtn(pdfs, m, renderPdfs)),
        el("div", { cls: "fields" }, field("종류", kind, "grow")),
        el("span", { cls: "d bad", textContent: m.error }))));
  }
}

/* ---------- 실행 ---------- */
/** 실행할 수 없는 이유. 빈 문자열이면 실행 가능. */
function problem() {
  if (busy) return "보내고 있어요.";
  if (!currentCourse()) return "과목과 학기를 정해 주세요.";
  const picked = lectures.filter((m) => m.on);
  if (!picked.length && !recs.length && !pdfs.length) return "넣을 항목을 골라 주세요.";
  if (picked.some((m) => !m.ok)) return "고른 강의의 주차와 차시를 확인했는지 체크해 주세요.";
  const names = [];
  for (const m of [...picked, ...recs]) {
    const w = num(m.week), s = num(m.session);
    if (w === null || s === null) return "주차와 차시를 1부터 99 사이 숫자로 모두 채워 주세요.";
    names.push(`${w}-${s}`);
  }
  if (new Set(names).size !== names.length) return "같은 주차와 차시가 겹쳐요.";
  return "";
}

function update() {
  const why = problem();
  $("run").disabled = why !== "";
  $("why").textContent = why;
}

function logLine(text, cls) { $("run-log").append(el("div", { cls: cls || "", textContent: text })); }

$("run").addEventListener("click", async () => {
  if (problem()) return;
  busy = true; update();
  $("run-log").replaceChildren();
  const course = currentCourse();
  const picked = lectures.filter((m) => m.on && m.ok);
  try {
    if (picked.length) {
      const body = { course, lectures: picked.map((m) => {
        const row = { id: String(m.lec.id), title: m.lec.title.slice(0, 300), week: num(m.week), session: num(m.session) };
        if (m.date) row.date = m.date;
        return row;
      }) };
      const r = await api("/api/lectures", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (!r.ok) { logLine(`이캠퍼스 강의를 등록하지 못했어요: ${r.detail || r.status}`, "bad"); return; }
      for (const m of picked) { m.on = false; m.ok = false; }
      renderLectures();
      logLine(`이캠퍼스 강의 ${picked.length}개를 등록했어요.`, "ok");
    }
    for (const kind of ["rec", "pdf"]) {
      const list = kind === "rec" ? recs : pdfs;
      for (const m of [...list]) {
        const q = new URLSearchParams({ kind: kind === "rec" ? "recording" : m.kind, course: course.course, term: course.term });
        if (course.ecampusId) q.set("ecampusId", course.ecampusId);
        if (course.code) q.set("code", course.code);
        if (course.section) q.set("section", course.section);
        if (kind === "rec") {
          q.set("week", String(num(m.week))); q.set("session", String(num(m.session)));
          if (m.date) q.set("date", m.date);
        }
        const r = await api(`/api/uploads?${q}`, { method: "POST", body: m.file,
          headers: { "X-Filename": encodeURIComponent(m.file.name) } });
        if (r.ok) { list.splice(list.indexOf(m), 1); logLine(`${m.file.name}: 보냈어요.`, "ok"); }
        else { m.error = r.detail || `실패했어요 (${r.status})`; logLine(`${m.file.name}: ${m.error}`, "bad"); }
      }
    }
  } finally {
    busy = false;
    renderRecs(); renderPdfs(); update(); poll();
  }
});

/* ---------- 진행 ---------- */
/** [상태 글자, 색 클래스, 진행률(%) 또는 null] */
function label(it) {
  switch (it.status) {
    case "download-wait": case "transcribe-wait": return ["기다리고 있어요", "", null];
    case "downloading": return ["받고 있어요", "", null];
    case "transcribing": {
      const m = /(\d+)\s*%/.exec(it.progress || "");
      const pct = m ? Math.min(Number(m[1]), 100) : null;
      return [pct === null ? "준비하고 있어요" : `전사하고 있어요 ${pct}%`, "run", pct === null ? 0 : pct];
    }
    case "done": return ["다 됐어요", "done", null];
    case "failed": return ["실패했어요", "fail", null];
    default: return [it.status, "", null];
  }
}

async function act(method, path) {
  const r = await api(path, { method });
  $("item-msg").textContent = r.ok ? "" : (r.detail || "처리하지 못했어요.");
  poll();
}

let lastSig = "";
function renderStatus(s) {
  $("banner-ffmpeg").replaceChildren();
  $("banner-login").replaceChildren();
  if (s.ffmpeg === false) $("banner-ffmpeg").append("이캠퍼스 영상을 받으려면 ffmpeg를 설치해 주세요: ", el("code", { textContent: "winget install Gyan.FFmpeg" }));
  if (!s.loggedIn && s.waitingLogin > 0) $("banner-login").textContent = `다시 로그인하면 남은 ${s.waitingLogin}개를 받아요`;
  if (s.loggedIn !== loggedIn) { setLogin(s.loggedIn); if (s.loggedIn && !courses.length) loadCourses(); }

  statusItems = s.items;
  paintLectureStatus();
  const sig = JSON.stringify(s.items);
  if (sig === lastSig) return;
  lastSig = sig;
  const box = $("items");
  box.replaceChildren();
  if (!s.items.length) box.append(el("p", { cls: "d", textContent: "아직 항목이 없어요." }));
  for (const it of s.items) {
    const [text, tone, pct] = label(it);
    const main = el("div", { cls: "lr-main" },
      el("span", { cls: "t", textContent: it.filename }),
      el("span", { cls: "d", textContent: `${KIND[it.kind] || it.kind}, ${it.bundle}` }));
    if (it.status === "failed") main.append(el("span", { cls: "d bad", textContent: it.error || "알 수 없는 오류가 생겼어요" }));
    // 삭제는 서버 DELETABLE(실패·대기)과 맞춘다. 다시 시도는 실패만.
    const buttons = [];
    if (it.status === "failed") buttons.push(el("button", { type: "button", cls: "weak", textContent: "다시 시도", on: { click: () => act("POST", `/api/items/${encodeURIComponent(it.id)}/retry`) } }));
    if (["failed", "download-wait", "transcribe-wait"].includes(it.status)) buttons.push(el("button", { type: "button", cls: "gray", textContent: "삭제", on: { click: () => act("DELETE", `/api/items/${encodeURIComponent(it.id)}`) } }));
    const row = el("div", { cls: "lr li" }, main, el("div", { cls: "lr-side" }, el("span", { cls: "status " + tone, textContent: text }),
      ...(buttons.length ? [el("div", { cls: "acts" }, ...buttons)] : [])));
    if (pct !== null) {
      const fill = el("i");
      fill.style.width = `${pct}%`;
      row.append(el("div", { cls: "bar" }, fill));
    }
    box.append(row);
  }
  const pending = s.items.some((it) => it.status !== "done");
  const done = s.items.length > 0 && !pending;
  $("done-msg").textContent = done ? "모두 끝났어요. Claude Code에서 '넣어줘'라고 말해 주세요." : "";
  $("done-msg").classList.toggle("hide", !done);
}

let polling = false;
async function poll() {
  if (polling) return;
  polling = true;
  try {
    const r = await api("/api/status");
    $("conn").textContent = r.ok ? "" : "서버에 연결할 수 없어요. 다시 연결하고 있어요";
    if (r.ok) renderStatus(r.data);
  } finally { polling = false; }
}
setInterval(poll, 2000);
poll();
update();
</script>
