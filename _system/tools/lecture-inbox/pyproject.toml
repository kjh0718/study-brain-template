[project]
name = "lecture-inbox"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# av 19.0.1 rejects the `metadata_errors` argument that faster-whisper 1.2.1's decode_audio passes.
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "faster-whisper==1.2.1", "av==16.0.1"]

[dependency-groups]
dev = ["httpx==0.28.1"]

[tool.uv]
package = false
exclude-newer = "2026-10-19T00:00:00Z"
